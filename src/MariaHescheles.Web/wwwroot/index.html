<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!--
        These defaults are what a crawler that does not execute JavaScript will see, because
        a standalone WebAssembly app ships exactly one HTML file. Components override them at
        runtime through <PageHead>; keep both in step when the tagline changes.
    -->
    <title>Maria Hescheles — Interior Designer</title>
    <base href="/" />
    <meta name="description" content="Maria Hescheles is an interior designer working across residential and commercial projects. Selected work, documented room by room." />
    <meta name="author" content="Maria Hescheles" />
    <link rel="canonical" href="https://mariahescheles.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Maria Hescheles" />
    <meta property="og:title" content="Maria Hescheles — Interior Designer" />
    <meta property="og:description" content="Selected interior design work, documented room by room." />
    <meta property="og:url" content="https://mariahescheles.com/" />
    <!--
        og:image must be a raster file (JPG or PNG, ideally 1200x630) for Slack, LinkedIn,
        iMessage and the rest to render a preview at all; they ignore SVG. Replace the
        placeholder below, and the matching Image="..." values on each page, with a real one.
    -->
    <meta property="og:image" content="https://mariahescheles.com/media/placeholder-wide.svg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!--
        Applies the colour scheme before the first paint, avoiding a white flash on dark-mode
        devices while WebAssembly boots. Synchronous and un-deferred on purpose.

        External rather than inline because the Content Security Policy forbids inline script.
        See js/boot-theme.js.
    -->
    <script src="js/boot-theme.js"></script>

    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="site.webmanifest" />
    <meta name="theme-color" content="#faf8f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121110" media="(prefers-color-scheme: dark)" />

    <link rel="stylesheet" href="css/app.css" />

    <!--
        three.js is resolved through an import map so that `import 'three'` inside scene.js
        works with no bundler and no build step. The version is pinned here and nowhere else.

        An import map has to be inline — external import maps are not broadly supported — so
        the Content Security Policy allows this one block by its sha256 hash. That hash is
        recomputed and verified by the deploy workflow, so editing the map without updating
        staticwebapp.config.json fails the build instead of silently breaking 3D in production.

        The library is only fetched when a visitor opens a 3D view; nothing on the critical
        path references it. To drop the third-party dependency entirely, vendor the files under
        wwwroot/lib/three/ and repoint these two entries.
    -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"
        }
    }
    </script>
</head>

<body>

    <!--
        The boot screen. Replaced by the app once WebAssembly is running.

        Blazor publishes download progress as the `--blazor-load-percentage` custom property,
        which css/boot.css turns into a determinate ring. Presenting real progress rather than
        an indefinite spinner is the difference between "loading" and "stuck".
    -->
    <div id="app">
        <div class="boot" role="status" aria-live="polite">
            <div class="boot__mark" aria-hidden="true">
                <span class="boot__initial">M</span>
                <span class="boot__initial">H</span>
            </div>
            <div class="boot__ring" aria-hidden="true"></div>
            <p class="boot__label">Loading</p>
        </div>
    </div>

    <!--
        Shown only if the runtime fails outright: a corrupted cache, a proxy mangling .wasm,
        or a browser too old for WebAssembly. Reloading genuinely fixes most of these.
    -->
    <div id="blazor-error-ui">
        <p>Something went wrong while loading the site.</p>
        <a href="." class="reload">Reload</a>
        <button type="button" class="dismiss" aria-label="Dismiss">&times;</button>
    </div>

    <!--
        The SDK ships this file content-fingerprinted (blazor.webassembly.<hash>.js). ASP.NET
        Core hosting serves both names, but Static Web Apps serves plain files, so only the
        fingerprinted one exists there and this reference would 404.

        The deploy workflow therefore copies the fingerprinted file to this stable name after
        publishing. Keep the plain name here: it is what the dev server serves, so local and
        production stay identical.
    -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
