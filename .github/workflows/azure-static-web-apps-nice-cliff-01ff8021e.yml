name: Azure Static Web Apps CI/CD

# The site is compiled here, on the GitHub Actions runner, and Static Web Apps only uploads
# the result. Two reasons this replaces the portal-generated workflow:
#
#   1. Static Web Apps' own build container has no .NET 10 SDK and ignores global.json, so it
#      cannot build this project at all. Building on the runner with a pinned SDK means CI
#      compiles the site exactly the way a developer does locally.
#
#   2. A failure here is a normal build log you can reproduce with one command, instead of an
#      error from inside a container you cannot inspect.
#
# The portal's OIDC steps are also gone: they npm-installed two packages on every run to mint
# a token that Azure/static-web-apps-deploy@v1 does not accept, which is the
# "Unexpected input(s) 'github_id_token'" warning. Deployment uses the API token secret.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  PROJECT: src/MariaHescheles.Web/MariaHescheles.Web.csproj
  PUBLISH_DIR: publish

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The exact patch version comes from global.json; this only selects the band.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore

      - name: Publish
        # Produces the IL-trimmed, Brotli-compressed static site under publish/wwwroot.
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Verify publish output
        # Catches a path or layout change here, with a clear message, rather than letting it
        # surface as an opaque directory error inside the deploy action.
        run: |
          test -f "${{ env.PUBLISH_DIR }}/wwwroot/index.html" \
            || { echo "::error::index.html not found in ${{ env.PUBLISH_DIR }}/wwwroot"; exit 1; }
          test -f "${{ env.PUBLISH_DIR }}/wwwroot/staticwebapp.config.json" \
            || echo "::warning::staticwebapp.config.json missing; deep links and MIME types will not be configured"

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_CLIFF_01FF8021E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # app_location already contains built output, so there is nothing left to build.
          # output_location must stay empty: it is resolved relative to app_location.
          app_location: ${{ env.PUBLISH_DIR }}/wwwroot
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          # The generated workflow omits this token, so teardown fails silently and preview
          # environments accumulate.
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_NICE_CLIFF_01FF8021E }}
          action: "close"
