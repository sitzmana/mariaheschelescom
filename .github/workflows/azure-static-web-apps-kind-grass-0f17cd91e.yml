name: Azure Static Web Apps CI/CD

# The site is compiled here, on the GitHub Actions runner, and Static Web Apps only uploads
# the result. Two reasons this replaces the portal-generated workflow:
#
#   1. Static Web Apps' own build container has no .NET 10 SDK and ignores global.json, so it
#      cannot build this project at all. Building on the runner with a pinned SDK means CI
#      compiles the site exactly the way a developer does locally.
#
#   2. A failure here is a normal build log you can reproduce with one command, instead of an
#      error from inside a container you cannot inspect.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  PROJECT: src/MariaHescheles.Web/MariaHescheles.Web.csproj
  PUBLISH_DIR: publish

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - name: Check deployment token
        # Fails in seconds instead of after a full build. A missing or empty secret otherwise
        # surfaces only at the deploy step, as an opaque "No matching Static Web App was found
        # or the api key was invalid". Tests for emptiness only; the value is never printed.
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_GRASS_0F17CD91E }}
        run: |
          if [ -z "$SWA_TOKEN" ]; then
            echo "::error::Secret AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_GRASS_0F17CD91E is missing or empty. Copy it from the Static Web App's Overview blade (Manage deployment token) into Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Verify Content Security Policy hash
        # The inline import map is allowed by sha256. Bumping the three.js version changes that
        # hash, and the only symptom would be 3D silently failing in production — the dev server
        # does not apply the CSP, so it cannot be caught locally by running the site.
        run: python tools/csp_hash.py --check

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # The exact patch version comes from global.json; this only selects the band.
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ${{ env.PROJECT }}

      - name: Build
        run: dotnet build ${{ env.PROJECT }} --configuration Release --no-restore

      - name: Publish
        # Produces the IL-trimmed, Brotli-compressed static site under publish/wwwroot.
        run: dotnet publish ${{ env.PROJECT }} --configuration Release --no-build --output ${{ env.PUBLISH_DIR }}

      - name: Verify publish output
        # Static Web Apps serves plain files, so index.html must name files that physically
        # exist. The SDK only emits blazor.webassembly.<hash>.js, so copy it to the stable name
        # index.html references. Copying rather than renaming keeps the fingerprinted name
        # valid for anything else that resolves it.
        run: |
          root="${{ env.PUBLISH_DIR }}/wwwroot"
          test -f "$root/index.html" || { echo "::error::index.html not found in $root"; exit 1; }
          test -f "$root/staticwebapp.config.json" \
            || echo "::warning::staticwebapp.config.json missing; deep links and MIME types will not be configured"

          if [ ! -f "$root/_framework/blazor.webassembly.js" ]; then
            fingerprinted=$(find "$root/_framework" -maxdepth 1 -name 'blazor.webassembly.*.js' ! -name '*.br' ! -name '*.gz' | head -n 1)
            test -n "$fingerprinted" \
              || { echo "::error::No blazor.webassembly script found in $root/_framework"; exit 1; }
            cp "$fingerprinted" "$root/_framework/blazor.webassembly.js"
            echo "Copied $(basename "$fingerprinted") to blazor.webassembly.js"
          fi

      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_GRASS_0F17CD91E }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          # app_location already contains built output, so there is nothing left to build.
          # output_location must stay empty: it is resolved relative to app_location.
          app_location: ${{ env.PUBLISH_DIR }}/wwwroot
          api_location: ""
          output_location: ""
          skip_app_build: true
          skip_api_build: true

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_KIND_GRASS_0F17CD91E }}
          action: "close"
